name: CI/CD

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/smaart-emr-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/smaart-emr-web

jobs:
  backend:
    name: Backend lint, unit, integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: smaart_migrator, POSTGRES_PASSWORD: smaart_dev, POSTGRES_DB: smaart_emr_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U smaart_migrator" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://smaart_app:smaart_dev@localhost:5432/smaart_emr_test
      MIGRATION_DATABASE_URL: postgres://smaart_migrator:smaart_dev@localhost:5432/smaart_emr_test
      REDIS_URL: redis://localhost:6379
      MONGODB_URI: mongodb://localhost:27017/smaart_emr_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      CORS_ORIGINS: http://localhost:3000
      EMAIL_TRANSPORT: none
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_DIR: ./.test-storage
      AUTH_ALLOW_PASSWORD_ONLY_LOGIN: "true"
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - name: Create least-privilege application role
        run: PGPASSWORD=smaart_dev psql -h localhost -U smaart_migrator -d smaart_emr_test -c "CREATE ROLE smaart_app LOGIN PASSWORD 'smaart_dev' NOSUPERUSER NOBYPASSRLS;"
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run test:unit
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

  frontend:
    name: Frontend build and end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: smaart_migrator, POSTGRES_PASSWORD: smaart_dev, POSTGRES_DB: smaart_emr_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U smaart_migrator" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://smaart_app:smaart_dev@localhost:5432/smaart_emr_test
      MIGRATION_DATABASE_URL: postgres://smaart_migrator:smaart_dev@localhost:5432/smaart_emr_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      CORS_ORIGINS: http://localhost:3000
      EMAIL_TRANSPORT: none
      STORAGE_PROVIDER: local
      AUTH_ALLOW_PASSWORD_ONLY_LOGIN: "true"
      LOG_LEVEL: silent
      E2E_ADMIN_EMAIL: e2e-admin@test.local
      E2E_ADMIN_PASSWORD: E2eAdmin12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: PGPASSWORD=smaart_dev psql -h localhost -U smaart_migrator -d smaart_emr_test -c "CREATE ROLE smaart_app LOGIN PASSWORD 'smaart_dev' NOSUPERUSER NOBYPASSRLS;"
      - run: npm ci
        working-directory: backend
      - run: npm run migrate && npm run seed
        working-directory: backend
      - run: BOOTSTRAP_ADMIN_EMAIL=$E2E_ADMIN_EMAIL BOOTSTRAP_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD npm run bootstrap:admin
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env: { VITE_API_URL: /api/v1 }
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }

  security-scan:
    name: Secret and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, scan-ref: ., severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true, format: sarif, output: trivy.sarif }
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif }

  docker:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [backend, frontend, security-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with: { context: backend, push: "${{ github.event_name != 'pull_request' }}", tags: "${{ env.IMAGE_API }}:${{ github.sha }}", cache-from: type=gha, cache-to: type=gha,mode=max }
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with: { context: frontend, push: "${{ github.event_name != 'pull_request' }}", tags: "${{ env.IMAGE_WEB }}:${{ github.sha }}", build-args: VITE_API_URL=/api/v1, cache-from: type=gha, cache-to: type=gha,mode=max }
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "${{ env.IMAGE_API }}:${{ github.sha }}", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }

  deploy-staging:
    name: Deploy to staging
    if: github.ref == 'refs/heads/main'
    needs: [docker]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - name: Render task definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with: { task-definition: deploy/aws/task-definition.api.json, container-name: api, image: "${{ env.IMAGE_API }}:${{ github.sha }}" }
      - name: Run database migrations (one-off task)
        run: |
          aws ecs run-task --cluster "${{ vars.ECS_CLUSTER }}" --launch-type FARGATE --task-definition "${{ vars.ECS_TASK_MIGRATE }}" \
            --network-configuration "${{ vars.ECS_NETWORK_CONFIG }}" --overrides '{"containerOverrides":[{"name":"api","command":["npm","run","migrate"]}]}'
      - name: Deploy API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with: { task-definition: "${{ steps.task.outputs.task-definition }}", service: "${{ vars.ECS_SERVICE_API }}", cluster: "${{ vars.ECS_CLUSTER }}", wait-for-service-stability: true }
      - name: Deploy worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with: { task-definition: "${{ steps.task.outputs.task-definition }}", service: "${{ vars.ECS_SERVICE_WORKER }}", cluster: "${{ vars.ECS_CLUSTER }}", wait-for-service-stability: true }
      - name: Smoke test
        run: curl --fail --silent "${{ vars.STAGING_URL }}/health/ready"

  deploy-production:
    name: Deploy to production
    if: github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production   # manual approval is configured on this GitHub environment
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with: { task-definition: deploy/aws/task-definition.api.json, container-name: api, image: "${{ env.IMAGE_API }}:${{ github.sha }}" }
      - name: Run database migrations (one-off task)
        run: |
          aws ecs run-task --cluster "${{ vars.ECS_CLUSTER }}" --launch-type FARGATE --task-definition "${{ vars.ECS_TASK_MIGRATE }}" \
            --network-configuration "${{ vars.ECS_NETWORK_CONFIG }}" --overrides '{"containerOverrides":[{"name":"api","command":["npm","run","migrate"]}]}'
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with: { task-definition: "${{ steps.task.outputs.task-definition }}", service: "${{ vars.ECS_SERVICE_API }}", cluster: "${{ vars.ECS_CLUSTER }}", wait-for-service-stability: true }
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with: { task-definition: "${{ steps.task.outputs.task-definition }}", service: "${{ vars.ECS_SERVICE_WORKER }}", cluster: "${{ vars.ECS_CLUSTER }}", wait-for-service-stability: true }
      - run: curl --fail --silent "${{ vars.PRODUCTION_URL }}/health/ready"
