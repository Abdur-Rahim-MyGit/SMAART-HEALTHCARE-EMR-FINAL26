# Local development stack. Production uses managed services (RDS, Atlas, ElastiCache, Amazon MQ).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smaart_migrator
      POSTGRES_PASSWORD: smaart_dev
      POSTGRES_DB: smaart_emr
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U smaart_migrator -d smaart_emr"], interval: 5s, retries: 10 }
  mongodb:
    image: mongo:7
    command: ["--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: smaart
      MONGO_INITDB_ROOT_PASSWORD: smaart_dev
    volumes: [mongodata:/data/db]
    ports: ["27017:27017"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: smaart
      RABBITMQ_DEFAULT_PASS: smaart_dev
    ports: ["5672:5672", "15672:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, retries: 10 }
  migrate:
    build: ./backend
    command: ["sh", "-c", "npx knex --knexfile knexfile.js migrate:latest && npx knex --knexfile knexfile.js seed:run"]
    environment: &api_env
      NODE_ENV: development
      PORT: "5001"
      DATABASE_URL: postgres://smaart_app:smaart_dev@postgres:5432/smaart_emr
      MIGRATION_DATABASE_URL: postgres://smaart_migrator:smaart_dev@postgres:5432/smaart_emr
      MONGODB_URI: mongodb://smaart:smaart_dev@mongodb:27017/smaart_emr?authSource=admin
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://smaart:smaart_dev@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-not-for-production-use-1234}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      EMAIL_TRANSPORT: console
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: ./backend
    environment: *api_env
    ports: ["5001:5001"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started }, rabbitmq: { condition: service_healthy }, mongodb: { condition: service_started } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5001/health/live"], interval: 15s, retries: 5 }
  worker:
    build: ./backend
    command: ["node", "src/workers/index.js"]
    environment: *api_env
    depends_on: { api: { condition: service_healthy } }
  web:
    build: { context: ./frontend, args: { VITE_API_URL: /api/v1 } }
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  pgdata: {}
  mongodata: {}
