# Local development stack. Production uses managed services (MongoDB Atlas or a self-managed
# replica set, ElastiCache Redis, Amazon MQ) — see deploy/aws/README.md.
services:
  mongodb:
    image: mongo:8
    # Single-node replica set: the API needs multi-document transactions.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongodata:/data/db]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }\""]
      interval: 5s
      timeout: 10s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: smaart
      RABBITMQ_DEFAULT_PASS: smaart_dev
    ports: ["5672:5672", "15672:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, retries: 10 }
  migrate:
    # Creates collections, validators, indexes and reference data (idempotent).
    build: ./backend
    command: ["node", "src/tools/migrate.js"]
    environment: &api_env
      NODE_ENV: development
      PORT: "5001"
      MONGODB_URI: mongodb://mongodb:27017/smaart_emr?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://smaart:smaart_dev@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-not-for-production-use-1234}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      EMAIL_TRANSPORT: console
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on: { mongodb: { condition: service_healthy } }
  api:
    build: ./backend
    environment: *api_env
    ports: ["5001:5001"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_started }, rabbitmq: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5001/health/live"], interval: 15s, retries: 5 }
  worker:
    build: ./backend
    command: ["node", "src/workers/index.js"]
    environment: *api_env
    depends_on: { api: { condition: service_healthy } }
  web:
    build: { context: ./frontend, args: { VITE_API_URL: /api/v1 } }
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  mongodata: {}
