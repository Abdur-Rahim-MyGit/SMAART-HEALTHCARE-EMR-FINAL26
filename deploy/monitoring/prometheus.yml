global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: smaart-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:5001"]
  - job_name: smaart-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9464"]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: mongodb
    static_configs: [{ targets: ["mongodb-exporter:9216"] }]
